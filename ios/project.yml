# UTUVO Type for iOS — xcodegen 專案定義
# 產生：cd ios && xcodegen generate
# 核心 UTUVOTypeCore 直接引用上層 SwiftPM package（純 Foundation，macOS/iOS 共用正本）。
name: "UTUVO Type"
options:
  bundleIdPrefix: com.utuvo
  deploymentTarget:
    # 2026-09-24：本機 Qwen3-ASR（MLX）需要 iOS 18。iOS 18 支援的機型與 iOS 17 相同（iPhone XS 起），沒有裝置被排除。
    iOS: "18.0"
  createIntermediateGroups: true
  # 介面原文是繁中（台灣用語）；简中（zh-Hans）翻譯在 String Catalog，其他語言一律退回繁中。
  developmentLanguage: zh-Hant

packages:
  UTUVOType:
    path: ..
  # 本機高準確度辨識（2026-09-24 Micky 核准 iPhone 方案 a）：speech-swift 的 Qwen3-ASR 子集，見 Packages/UTUVOQwenASR/NOTICE.md。
  UTUVOQwenASR:
    path: Packages/UTUVOQwenASR

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "RPNT54P79S"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.2.2"
    CURRENT_PROJECT_VERSION: "21"

targets:
  "UTUVOTypeiOS":
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Assets.xcassets
      # iOS 26+ Liquid Glass app icon：iOS／macOS 共用的單一正本（scripts/make-icon.py 產生）
      - path: ../assets/branding/AppIcon.icon
      # 2026-09-20 runtime 票：可選專業詞庫（catalog.json + six pack .txt；CONTRACT-V2 schema 2）。
      # folder reference — xcodegen 會建 blue folder，runtime 端從 Bundle.main/vocabulary/ 讀。
      - path: ../data/vocabulary
        type: folder
    dependencies:
      - package: UTUVOType
        product: UTUVOTypeCore
      # 只給主 app：鍵盤 extension 有記憶體上限，錄音與辨識本來就在主 app（VoiceBridge）。
      - package: UTUVOQwenASR
        product: Qwen3ASR
      - target: "UTUVOKeyboard"
    entitlements:
      path: App/UTUVOTypeiOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.utuvo.type]
        # 個人字典 iPhone↔Mac 同步（2026-09-20）：iCloud 鍵值儲存，Mac 版用同一個識別碼讀寫同一份。
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.utuvo.type.ios
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "UTUVO Type"
        CFBundleDevelopmentRegion: zh-Hant
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: "UTUVO Type 在你聽寫、或從 UTUVO Type 鍵盤開啟語音時使用麥克風，把語音轉成文字。"
        NSSpeechRecognitionUsageDescription: "UTUVO Type 使用 iOS 語音辨識把你的口述轉成文字。"
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # 鍵盤不能開麥克風：鍵盤用這個 URL 叫起主 app，主 app 在背景替鍵盤錄音（VoiceBridge）。
        CFBundleURLTypes:
          - CFBundleURLName: com.utuvo.type.voice
            CFBundleURLSchemes: [utuvotype]
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.utuvo.type.ios
        # 首發只上 iPhone（iPad 版面與鍵盤沒驗過；之後要上改 "1,2" 並補 iPad 截圖）。要寫在每個 target 才生效。
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  "UTUVOKeyboard":
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
      # BrandMark（字幕帶品牌）、OrbGlyph（打字區回語音鍵）
      - path: Assets.xcassets
      # 鍵盤 extension 也內附同樣 catalog（key 端 contextualStrings 會用到 seed）。
      - path: ../data/vocabulary
        type: folder
    dependencies:
      - package: UTUVOType
        product: UTUVOTypeCore
    entitlements:
      path: Keyboard/UTUVOKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.utuvo.type]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: "UTUVO Type"
        # extension 的版號要跟主 app 一致（原本寫死 "1"，上傳 App Store 會被標 ITMS-90473）。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: zh-Hant
        # IOS4：鍵盤 target 自己的 usage description，文案照鍵盤實際場景寫，
        # 不再靠 host app 的字串頂著。
        NSMicrophoneUsageDescription: "UTUVO Type 鍵盤只在你按下麥克風鍵時錄音，把語音轉成文字插入游標處。"
        NSSpeechRecognitionUsageDescription: "UTUVO Type 鍵盤使用 iOS 語音辨識把你的口述轉成文字；鍵盤版走伺服器辨識，音訊會送到 Apple。"
        NSExtension:
          NSExtensionAttributes:
            PrimaryLanguage: zh-Hant
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.utuvo.type.ios.keyboard
        # 首發只上 iPhone（iPad 版面與鍵盤沒驗過；之後要上改 "1,2" 並補 iPad 截圖）。要寫在每個 target 才生效。
        TARGETED_DEVICE_FAMILY: "1"
        # 與 legacy host-arbiter shim 保持建置相容；目前送審版本只使用公開 API。
        SWIFT_OBJC_BRIDGING_HEADER: Keyboard/UTUVOKeyboard-Bridging-Header.h

  "UTUVOTypeiOSTests":
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iOSTests
        excludes: [Resources]
      - path: iOSTests/Resources
        buildPhase: resources
    dependencies:
      - target: "UTUVOTypeiOS"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/UTUVOTypeiOS.app/UTUVOTypeiOS"
        BUNDLE_LOADER: "$(TEST_HOST)"

  "UTUVOTypeiOSUITests":
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iOSUITests
    dependencies:
      - target: "UTUVOTypeiOS"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: UTUVOTypeiOS

schemes:
  "UTUVOTypeiOS":
    build:
      targets:
        "UTUVOTypeiOS": all
        "UTUVOKeyboard": [run]
        "UTUVOTypeiOSTests": [test]
        "UTUVOTypeiOSUITests": [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - "UTUVOTypeiOSTests"
        - "UTUVOTypeiOSUITests"
